version: 2
updates:
  - package-ecosystem: gomod
    directory: /cli-go
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /cli-mcp-server
    schedule:
      interval: weekly
    groups:
      cli-mcp-server-dependencies:
        patterns: ["*"]
